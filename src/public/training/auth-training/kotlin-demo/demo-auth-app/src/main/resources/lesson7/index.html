<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auth-Demo</title>
</head>

<body>
<div>
    <label>
        <input type="text" id="login_username"/>
    </label>
    <label>
        <input type="text" id="login_password"/>
    </label>
    <button onclick="login()" >Submit</button>

    <button onclick="testBearer()" >Test Bearer</button>
    <button onclick="testJwt()" >Test JWT After Login</button>
</div>
</body>

<script>
    var jwt = "";

    function login() {
        var inputUsername = document.getElementById("login_username").value;
        var inputPassword = document.getElementById("login_password").value;

        fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                username: inputUsername,
                password: inputPassword,
            }),
        }).then((success) => {
            // Read the JWT from the response body.
            // Store it in global JWT variable
            success.json().then((data) => {
                jwt = data.token;
                console.log("JWT: ", jwt);
            });
            console.log("Success: ", success);
        }).catch((error) => {
            console.log("Error: ", error);
        });
    }

    function testBearer() {

    function testJwt() {
        console.log("Sending JWT: ", jwt)

</script>
