workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_EVENT_TYPE
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - publishDocs

checkDocGeneration:
  stage: publishDocs
  rules:
    - if: $CI_MERGE_REQUEST_EVENT_TYPE
  image:
    name: confluencepublisher/confluence-publisher:0.0.0-SNAPSHOT
    entrypoint: [""]
  variables:
    ASCIIDOC_ROOT_FOLDER: .
    CONVERT_ONLY: true
    ROOT_CONFLUENCE_URL: https://calian-at.atlassian.net/wiki
    USERNAME: $CONFLUENCE_USERNAME
    PASSWORD: $CONFLUENCE_PASSWORD
    SPACE_KEY: ENG
    ANCESTOR_ID: 15152971812
    ORPHAN_REMOVAL_STRATEGY: REMOVE_ORPHANS
    PAGE_TITLE_SUFFIX: " - Git Mirror"
  script:
    # Main readme must be the same name as the folder that the other lessons are nested under.
    - mv README.md lessons.adoc
    - publish.sh

publishDocs:
  stage: publishDocs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image:
    name: confluencepublisher/confluence-publisher:0.0.0-SNAPSHOT
    entrypoint: [""]
  variables:
    ASCIIDOC_ROOT_FOLDER: .
    ROOT_CONFLUENCE_URL: https://calian-at.atlassian.net/wiki
    USERNAME: $CONFLUENCE_USERNAME
    PASSWORD: $CONFLUENCE_PASSWORD
    SPACE_KEY: ENG
    ORPHAN_REMOVAL_STRATEGY: REMOVE_ORPHANS
    ANCESTOR_ID: 15152971812
    PAGE_TITLE_SUFFIX: " - Git Mirror"
  script:
    # Main readme must be the same name as the folder that the other lessons are nested under.
    - mv README.md lessons.adoc
    - publish.sh
