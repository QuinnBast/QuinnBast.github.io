apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-rest-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - path: /rest(/)(.*)
            pathType: Prefix
            backend:
              service:
                name: python-rest-service
                port:
                  number: 8080
